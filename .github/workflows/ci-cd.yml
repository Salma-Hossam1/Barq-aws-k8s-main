name: ci-cd

on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", "requirements.txt"]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/barq

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, ARM64, barq]
    steps:
      - name: Roll out the new image
        run: |
          kubectl -n barq-assessment set image deployment/barq-app app=${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          kubectl -n barq-assessment rollout status deployment/barq-app --timeout=180s
      - name: Roll back if the rollout failed
        if: failure()
        run: kubectl -n barq-assessment rollout undo deployment/barq-app
      - name: Verify the running version
        run: |
          kubectl -n barq-assessment get deployment barq-app -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          curl -s http://localhost:30080/

  update-manifest:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image tag in the manifest
        run: |
          sed -i "s#image: .*/barq:.*#image: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}#" k8s/app/deployment.yaml
      - name: Commit the change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/app/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: deploy barq:${{ needs.build.outputs.tag }} [skip ci]"
          git push
