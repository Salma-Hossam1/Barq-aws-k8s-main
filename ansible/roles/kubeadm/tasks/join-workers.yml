
---
- name: Check whether the worker has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_config

- name: Generate a worker join command on the control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - token
      - create
      - --print-join-command
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: true
  register: kubeadm_join_command
  changed_when: false
  when: not worker_kubelet_config.stat.exists

- name: Join worker to the Kubernetes cluster
  ansible.builtin.command:
    argv: "{{ kubeadm_join_command.stdout.split() }}"
  when: not worker_kubelet_config.stat.exists